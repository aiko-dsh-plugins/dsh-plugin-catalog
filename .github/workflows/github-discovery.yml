name: Refresh GitHub community discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'package*.json', '.github/workflows/github-discovery.yml']

permissions:
  contents: write

concurrency:
  group: github-community-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/cache/restore@v4
        with:
          path: .discovery-cache
          key: github-discovery-v1-${{ github.run_id }}
          restore-keys: github-discovery-v1-
      - run: npm run discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .discovery-cache
          key: github-discovery-v1-${{ github.run_id }}
      - name: Publish feed on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-topic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh GitHub community discovery'
          git push origin HEAD:main
